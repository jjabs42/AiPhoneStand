<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{url_for('static', filename='styles.css')}}" rel="stylesheet">
    <title>Webcam Stream & Capture</title>
    
</head>
<body>

    <!-- Countdown overlay display element -->
    <div id="countdownDisplay"></div>

    <video id="webcamVideo" autoplay playsinline muted></video>
    
    <div class="controls">
        <!-- Timer Select Dropdown -->
        <select id="timerSelect" class="btn">
            <option value="0">No Delay</option>
            <option value="3">3s Delay</option>
            <option value="5">5s Delay</option>
            <option value="10">10s Delay</option>
        </select>

        <button id="flipBtn" class="btn">Flip Camera</button>
        <button id="captureBtn" class="btn" style="background-color: #ff3b30; color: white;">Take Picture</button>
        <!-- NEW: Start Tracking Button -->
        <button id="trackBtn" class="btn" style="background-color: #007aff; color: white;">Start Tracking</button>
    </div>

    <div id="previewContainer">
        <img id="photoPreview" alt="Captured photo preview">
    </div>

    <canvas id="captureCanvas" style="display: none;"></canvas>

    <script src="{{url_for('static', filename='code.js')}}"></script>
</body>
</html>
